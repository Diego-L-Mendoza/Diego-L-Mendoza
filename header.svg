<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0A1A3A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3B82F6" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" fill="url(#night)"/>
  <rect width="1200" height="200" fill="url(#dots)"/>

  <!-- rising sparks -->
  <g fill="#60A5FA">
    <circle cx="140" cy="210" r="2.5"><animate attributeName="cy" from="210" to="-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="210" r="1.8"><animate attributeName="cy" from="210" to="-10" dur="8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="210" r="2.2"><animate attributeName="cy" from="210" to="-10" dur="7s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="210" r="1.6"><animate attributeName="cy" from="210" to="-10" dur="9s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="3s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#1D4ED8">
    <circle cx="220" cy="210" r="1.5"><animate attributeName="cy" from="210" to="-10" dur="10s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="210" r="2"><animate attributeName="cy" from="210" to="-10" dur="6.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="92" text-anchor="middle" font-family="Consolas, 'Fira Code', Menlo, monospace" font-size="44" font-weight="700" fill="#E6EDF3" letter-spacing="2">Diego Mendoza</text>
  <rect x="420" y="108" width="360" height="2" fill="url(#rule)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="138" text-anchor="middle" font-family="Consolas, 'Fira Code', Menlo, monospace" font-size="17" fill="#3B82F6">ML Engineer · Systems &amp; Agentic AI</text>
</svg>
