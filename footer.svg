<svg width="100%" height="80" viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1A3A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <pattern id="dotsf" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3B82F6" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="80" fill="url(#nightf)"/>
  <rect width="1200" height="80" fill="url(#dotsf)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#3B82F6" opacity="0.6"/>
  <circle cx="600" cy="44" r="4" fill="#60A5FA">
    <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
